name: scheduled publish

# Runs twice a day. If any draft post has a publish date of today, it is flipped
# to draft: false and committed back to main. Cloudflare Workers Builds deploys
# every push to main, so the commit is what publishes the post.
# A post with a time in its publishDate (e.g. 2026-10-22T08:00:00-07:00) is
# flipped by the first run but Hugo hides it until that time. The second run has
# nothing to flip, so it pushes an empty commit to trigger the rebuild that makes
# the post visible.
on:
  schedule:
    - cron: '0 7 * * *'   # 07:00 UTC daily (midnight PT): date-only posts
    - cron: '5 15 * * *'  # 15:05 UTC daily (08:05 PDT): posts timed for 8am PT
  workflow_dispatch:        # allow manual runs for testing

permissions:
  contents: write

concurrency:
  group: scheduled-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Release posts whose publish date is today
        id: promote
        run: bash .github/scripts/publish-scheduled.sh

      # Any push to main triggers a Cloudflare build. If a draft was flipped, commit it.
      # Otherwise, if a post is dated today, push an empty commit so Cloudflare
      # rebuilds and shows posts whose publish time has now passed.
      - name: Commit and push to trigger a Cloudflare build
        if: steps.promote.outputs.rebuild == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.promote.outputs.promoted }}" = "1" ]; then
            git add -A
            git commit -m "Auto-publish scheduled posts for $(date -u +%Y-%m-%d)"
          else
            git commit --allow-empty -m "Rebuild for timed posts on $(date -u +%Y-%m-%d)"
          fi
          git push origin HEAD:main
